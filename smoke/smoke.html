<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Essentia.js KGT Smoke Test</title>
</head>
<body>
  <pre id="output">Booting essentia...</pre>
  <script src="../node_modules/essentia.js/dist/essentia-wasm.web.js"></script>
  <script src="../node_modules/essentia.js/dist/essentia.js-extractor.js"></script>
  <script>
    // Inline tempo correction matching src/tempo-correction.ts (ambiguity-aware)
    const MIN_SANE = 60;
    const MAX_SANE = 180;
    const MUSICAL_MAX = 200;
    function correctTempo(rawTempo) {
      let corrected = rawTempo;
      let wasCorrected = false;
      while (corrected > MAX_SANE) { corrected /= 2; wasCorrected = true; }
      while (corrected < MIN_SANE && corrected > 0) { corrected *= 2; wasCorrected = true; }
      if (corrected < MIN_SANE && corrected > 0) { corrected *= 2; wasCorrected = true; }
      const rounded = Math.round(corrected);
      const doubled = Math.round(corrected * 2);
      return {
        tempo: rounded,
        rawTempo: Math.round(rawTempo * 100) / 100,
        wasCorrected,
        alternateTempo: (!wasCorrected && doubled <= MUSICAL_MAX && doubled !== rounded)
          ? doubled : undefined
      };
    }
  </script>
  <script>
    // Load raw Float32 binary from URL
    async function loadF32(url) {
      const resp = await fetch(url);
      const buffer = await resp.arrayBuffer();
      return new Float32Array(buffer);
    }

    function toVector(wasm, arr) {
      const vec = new wasm.VectorFloat();
      for (let i = 0; i < arr.length; i++) vec.push_back(arr[i]);
      return vec;
    }

    async function run() {
      const el = document.getElementById("output");
      try {
        const wasm = await EssentiaWASM();
        const ex = new EssentiaExtractor(wasm, false);

        const results = { version: ex.version, tests: {}, loaded: true };

        // 1. drums_90
        const d90 = toVector(wasm, await loadF32("./fixtures/drums_90.f32"));
        const r90raw = ex.PercivalBpmEstimator(d90).bpm;
        const r90 = correctTempo(r90raw);
        results.tests.drums_90 = { bpm: r90.tempo, rawBpm: r90.rawTempo, wasCorrected: r90.wasCorrected, expected: 90 };

        // 2. drums_140 — Percival often locks to 70 on 4/4 at 140 BPM
        const d140 = toVector(wasm, await loadF32("./fixtures/drums_140.f32"));
        const r140raw = ex.PercivalBpmEstimator(d140).bpm;
        const r140 = correctTempo(r140raw);
        results.tests.drums_140 = {
          bpm: r140.tempo,
          rawBpm: r140.rawTempo,
          wasCorrected: r140.wasCorrected,
          alternateTempo: r140.alternateTempo,
          expected: 140,
          note: "raw=70; alternateTempo=140 surfaces half/double ambiguity"
        };

        // 3. pulse_200
        const d200 = toVector(wasm, await loadF32("./fixtures/pulse_200.f32"));
        const r200raw = ex.PercivalBpmEstimator(d200).bpm;
        const r200 = correctTempo(r200raw);
        results.tests.pulse_200 = {
          bpm: r200.tempo,
          rawBpm: r200.rawBpm,
          wasCorrected: r200.wasCorrected,
          alternateTempo: r200.alternateTempo,
          expected: 200,
          note: "raw=100; alternateTempo=200 surfaces half/double ambiguity"
        };

        // 4. drums_72
        const d72 = toVector(wasm, await loadF32("./fixtures/drums_72.f32"));
        const r72raw = ex.PercivalBpmEstimator(d72).bpm;
        const r72 = correctTempo(r72raw);
        results.tests.drums_72 = {
          bpm: r72.tempo,
          rawBpm: r72.rawBpm,
          wasCorrected: r72.wasCorrected,
          expected: 72
        };

        // 4. triad_cmin — key detection
        const triad = toVector(wasm, await loadF32("./fixtures/triad_cmin.f32"));
        const rk = ex.KeyExtractor(triad, "edma");
        results.tests.triad_cmin = {
          key: rk.key,
          scale: rk.scale,
          strength: rk.strength,
          expectedKey: "C",
          expectedScale: "minor",
        };

        // 5. dc_garbage — confidence floor calibration
        const dc = toVector(wasm, await loadF32("./fixtures/dc_garbage.f32"));
        const rdc = ex.KeyExtractor(dc, "edma");
        results.tests.dc_garbage = {
          key: rdc.key,
          scale: rdc.scale,
          strength: rdc.strength,
          note: "calibration_baseline",
        };

        el.textContent = JSON.stringify(results, null, 2);
      } catch (err) {
        el.textContent = JSON.stringify(
          { loaded: false, error: err.message, stack: err.stack },
          null,
          2
        );
      }
    }
    run();
  </script>
</body>
</html>
