<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>User Instrumental Test</title>
</head>
<body>
  <pre id="output">Booting essentia...</pre>
  <script src="../node_modules/essentia.js/dist/essentia-wasm.web.js"></script>
  <script src="../node_modules/essentia.js/dist/essentia.js-extractor.js"></script>
  <script>
    const MIN_SANE = 60;
    const MAX_SANE = 180;
    const MUSICAL_MAX = 200;
    function correctTempo(rawTempo) {
      let corrected = rawTempo;
      let wasCorrected = false;
      while (corrected > MAX_SANE) { corrected /= 2; wasCorrected = true; }
      while (corrected < MIN_SANE && corrected > 0) { corrected *= 2; wasCorrected = true; }
      if (corrected < MIN_SANE && corrected > 0) { corrected *= 2; wasCorrected = true; }
      const rounded = Math.round(corrected);
      const doubled = Math.round(corrected * 2);
      return {
        tempo: rounded,
        rawTempo: Math.round(rawTempo * 100) / 100,
        wasCorrected,
        alternateTempo: (!wasCorrected && doubled <= MUSICAL_MAX && doubled !== rounded)
          ? doubled : undefined
      };
    }
  </script>
  <script>
    async function loadF32(url) {
      const resp = await fetch(url);
      const buffer = await resp.arrayBuffer();
      return new Float32Array(buffer);
    }

    function toVector(wasm, arr) {
      const vec = new wasm.VectorFloat();
      for (let i = 0; i < arr.length; i++) vec.push_back(arr[i]);
      return vec;
    }

    async function run() {
      const el = document.getElementById("output");
      try {
        const wasm = await EssentiaWASM();
        const ex = new EssentiaExtractor(wasm, false);

        const results = { version: ex.version, tests: {}, loaded: true };

        // USER FILE: real instrumental (48000Hz, mono F32)
        const arr = await loadF32("./fixtures/user_test.f32");
        const duration = arr.length / 48000;

        // Use a representative 30s sample from the middle to avoid intro/outro
        const sampleLen = Math.min(arr.length, 48000 * 30);
        const start = Math.floor((arr.length - sampleLen) / 2);
        const sample = arr.subarray(start, start + sampleLen);

        const sig = toVector(wasm, sample);

        // Tempo
        const tempoRaw = ex.PercivalBpmEstimator(sig).bpm;
        const tempo = correctTempo(tempoRaw);

        // Key
        const keyInfo = ex.KeyExtractor(sig, "edma");

        results.tests.user_test = {
          bpm: tempo.tempo,
          rawBpm: tempo.rawTempo,
          alternateTempo: tempo.alternateTempo,
          wasCorrected: tempo.wasCorrected,
          key: keyInfo.key,
          scale: keyInfo.scale,
          strength: keyInfo.strength,
          confidence: keyInfo.strength,
          duration: Math.round(duration * 100) / 100,
          sampleRate: 48000,
          note: "Real instrumental: trust the ears, not the gauge"
        };

        el.textContent = JSON.stringify(results, null, 2);
      } catch (err) {
        el.textContent = JSON.stringify(
          { loaded: false, error: err.message, stack: err.stack },
          null, 2
        );
      }
    }
    run();
  </script>
</body>
</html>
